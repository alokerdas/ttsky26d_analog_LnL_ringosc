# Tiny Tapeout project information
project:
  title:        "Programmable Ring Oscillator"      # Project title
  author:       "Aloke Kumar Das"      # Your name
  discord:      "L&L"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable Ring Oscillator"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 5        # Valid values: 0 to 6
  uses_vapwr: true       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_LnL_ringosc"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "prog0_m8I0_srmA0"
  ui[1]: "prog1_m8I1_srmA1"
  ui[2]: "prog2_m8I2_srmwe"
  ui[3]: "prog3_m8I3_srmpreb"
  ui[4]: "bypass0_m8I4_srmD0"
  ui[5]: "bypass1_m8I5_srmD1"
  ui[6]: "bypass2_m8I6_srmD2"
  ui[7]: "bypass3_m8I7_srmD3"

  # Outputs
  uo[0]: "sram_dout0"
  uo[1]: "sram_dout1"
  uo[2]: "sram_dout2"
  uo[3]: "sram_dout3"
  uo[4]: "mux8x1_out"
  uo[5]: "out_div128"
  uo[6]: "out_div256"
  uo[7]: "Grounded"

  # Bidirectional pins
  uio[0]: "DACin0_m8S0_srmsae"
  uio[1]: "DACin1_m8S1_srmwlen"
  uio[2]: "DACin2_m8S2"
  uio[3]: "DACin3"
  uio[4]: "DACin4"
  uio[5]: "DACin5"
  uio[6]: "DACin6"
  uio[7]: "DACin7"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "freq_out"
  ua[1]: "vcofin_out"
  ua[2]: "vco_vdiv_ctrl_in"
  ua[3]: "osc9_out"
  ua[4]: "dac_out"
  ua[5]: ""

# Do not change!
yaml_version: 6
