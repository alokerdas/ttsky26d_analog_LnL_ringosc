# Tiny Tapeout project information
project:
  title:        "Programmable Ring Oscillator"      # Project title
  author:       "Aloke Kumar Das"      # Your name
  discord:      "L&L"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable Ring Oscillator"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 1        # Valid values: 0 to 6
  uses_vapwr: true       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_LnL_ringosc"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "prog1"
  ui[1]: "prog2"
  ui[2]: "prog2"
  ui[3]: "prog2"
  ui[4]: "bypass0"
  ui[5]: "bypass1"
  ui[6]: "bypass2"
  ui[7]: "bypass3"

  # Outputs
  uo[0]: "Grounded"
  uo[1]: "Grounded"
  uo[2]: "Grounded"
  uo[3]: "Grounded"
  uo[4]: "Grounded"
  uo[5]: "Grounded"
  uo[6]: "Grounded"
  uo[7]: "Grounded"

  # Bidirectional pins
  uio[0]: "Out Grounded"
  uio[1]: "Out Grounded"
  uio[2]: "Out Grounded"
  uio[3]: "Out Grounded"
  uio[4]: "Out Grounded"
  uio[5]: "Out Grounded"
  uio[6]: "Out Grounded"
  uio[7]: "Out Grounded"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "freq_out"
  ua[1]: "Not used"
  ua[2]: "Not used"
  ua[3]: "Not used"
  ua[4]: "Not used"
  ua[5]: "Not used"

# Do not change!
yaml_version: 6
